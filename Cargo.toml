[package]
name = "qrbin"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Minimal, offline-first QR code generator with no telemetry and no network access."
authors = ["Your Name <you@example.com>"]
license = "MIT"
repository = "https://github.com/yourorg/qrbin"
homepage = "https://github.com/yourorg/qrbin"
readme = "README.md"
keywords = ["qr", "qrcode", "qr-code", "offline", "privacy"]
categories = ["command-line-utilities", "encoding", "graphics"]

[dependencies]
clap = { version = "4.5", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
] }
qrcode = { version = "0.14", default-features = false, features = [
    "image",
    "svg",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.min-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
