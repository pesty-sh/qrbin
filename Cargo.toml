[package]
name = "qrbin"
version = "0.1.9"
edition = "2021"
rust-version = "1.85"
description = "Minimal, offline-first QR code generator with no telemetry and no network access."
authors = ["pesty-sh <pesty@pesty.sh>"]
license = "MIT"
repository = "https://github.com/pesty-sh/qrbin"
homepage = "https://pesty.sh"
readme = "README.md"
keywords = ["qr", "qrcode", "qr-code", "offline", "privacy"]
categories = ["command-line-utilities", "encoding", "graphics"]

[dependencies]
clap = { version = "4.5", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
] }
qrcode = { version = "0.14", default-features = false, features = [
    "image",
    "svg",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
qr-code-styling = { version = "0.2.4", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.min-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# cargo-deb reads this when GitHub Actions packs the static musl binaries.
# `make deb` on the Mac does not. That path uses packaging/mkdeb.py and
# still depends on glibc 2.27. The two .deb files can share a filename.
# Apt publishes the glibc one. The GitHub Release publishes the musl one.
[package.metadata.deb]
maintainer = "pesty-sh <pesty@pesty.sh>"
copyright = "2026 pesty-sh"
section = "utils"
priority = "optional"
# Static musl binaries do not link glibc. An empty depends list stops
# cargo-deb from adding libc6 via `$auto`.
depends = ""
extended-description = """
Turns text into a QR image and writes it to stdout.
No network access and no telemetry.
This package is a static musl build. It does not depend on glibc.
Installing or removing it only adds or removes /usr/bin/qrbin.
"""
assets = [
    # `target/release/` is a token cargo-deb rewrites for the real target dir.
    ["target/release/qrbin", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/qrbin/README.md", "644"],
    ["LICENSE", "usr/share/doc/qrbin/LICENSE", "644"],
]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
