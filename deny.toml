# Licence and crate bans. CI runs `cargo deny check`.
# Networking crates are also rejected by packaging/check-no-network.sh.
#
# An OR licence passes when one side is allowed. r-efi is
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later", so MIT is enough.
# LGPL is not on this list.

[advisories]
version = 2
yanked = "warn"
ignore = [
    # qr-code-styling 0.2.4 pulls these through usvg. The advisory says
    # there is no fixed release. They shape fonts for themed labels.
    # They do not open a socket. Drop the ignore when a styling release
    # moves to a maintained parser.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz via qr-code-styling 0.2.4, no upgrade" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via qr-code-styling 0.2.4, no upgrade" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "ureq" },
    { name = "tokio" },
    { name = "async-std" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "rustls" },
    { name = "quinn" },
    { name = "socket2" },
    { name = "mio" },
    { name = "cc" },
    { name = "cmake" },
    { name = "bindgen" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
